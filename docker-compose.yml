# Stack za domovina-rag.
# Plan: ../fetch.domovina.tv/docs/rag_clickhouse_postgres_plan.md §9
#
# Project name = prefix za sve resource imena (containers, networks, volumes).
# `domovina-rag-infra-*` ime sačuvano radi backward compat s postojećim volume-ima
# (lokalni dev podatci u `domovina-rag-infra_pg_data` itd.).
#
# Locira na repo root-u (NE u infra/) jer Coolify treat-a compose-file dir kao
# project root i `build:` paths se resolvaju protiv njega. Init.sql skripte
# i dalje žive u `infra/{postgres,clickhouse}/` — referenciramo ih s repo-root
# relativnim path-em ispod.
name: domovina-rag-infra

services:
  postgres:
    # pgvector image dodaje `vector` extension (potrebno za infra/postgres/init.sql).
    # Vanilla postgres:16-alpine nema pgvector pa init script fail-a.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedder:
    build: ./services/embedder
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL}
      EMBEDDER_DEVICE: ${EMBEDDER_DEVICE}
      # bge-m3 native ctx = 8192 *tokenova* (~24-32K znakova HR teksta).
      # Char-based limit u embedder app/main.py je samo safety margin;
      # default 8192 chars je prerigorozan i odbija valjane chunkove.
      EMBEDDER_MAX_TEXT_LEN: "32768"
    volumes:
      - hf_cache:/root/.cache/huggingface
    # `web` je potreban za prvi run jer sentence-transformers povlači
    # bge-m3 weights s huggingface.co. Nakon prvog cache hita (hf_cache
    # volume) ostali pull-ovi su no-op pa internet nije strogo nužan.
    networks: [internal, web]
    restart: unless-stopped
    # NB: bez profile-a — auto-startuje s `docker compose up`. Za minimal dev
    # (samo DB-ovi) koristi `docker compose up postgres clickhouse` (eksplicitno
    # imena servisa) umjesto profile-a, jer build je velik (~3GB s torch+bge-m3).
    # Coolify ne podržava `--profile` flag iz UI-a, pa profile-i NE valjaju u cloud-u.

  etl:
    build: ./services/etl
    # NB: embedder NIJE u depends_on namjerno — `EMBEDDER_URL` može pokazivati
    # na host (npr. dev MPS embedder na `host.docker.internal:8000`) ili na
    # containerized embedder. Sam URL je single source of truth; depends_on
    # bi forsirao container path.
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8000}
    volumes:
      # Read-only mount producer output direktorija. Override DATA_SOURCE_DIR u .env-u
      # da uperi na lokalni path (npr. `../fetch.domovina.tv/storage/output`).
      # Default `/tmp` je placeholder za cloud (gdje ETL servis nije aktiviran — profiles=[etl]).
      - ${DATA_SOURCE_DIR:-/tmp}:/data:ro
    # `web` mreža potrebna ako EMBEDDER_URL pokazuje na host.docker.internal
    # (Docker Desktop na Mac/Win to rješava preko host gateway-a, što ide
    # preko bridge mreže — ne radi na internal-only).
    networks: [internal, web]
    # One-shot job — pokreće se preko `docker compose run --rm etl ingest --input /data`.
    profiles: ["etl"]

  mcp:
    build: ./services/mcp
    # NB: embedder NIJE u depends_on — vidi komentar na `etl` servisu.
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      MCP_TRANSPORT: http
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      EMBEDDER_URL: ${EMBEDDER_URL:-http://embedder:8000}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE}
      MCP_API_KEY: ${MCP_API_KEY}
    ports:
      - "${MCP_PORT:-3000}:3000"
    networks: [internal, web]
    restart: unless-stopped
    # Bez profile-a — Coolify auto-startuje. Vidi komentar na `embedder` servisu.

volumes:
  pg_data:
  ch_data:
  hf_cache:

networks:
  internal:
    internal: true
  web:
    driver: bridge
