# Production override za Coolify deployment.
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d
#
# Razlike od base compose-a:
# - mcp NE expozira ports (Cloudflare Tunnel -> Traefik routing umjesto direct port bind)
# - mcp dobiva Traefik labels za Host header routing
# - embedder forsiran na CPU (host MPS NE postoji u prod-u, EMBEDDER_DEVICE iz env-a)
# - ETL servis nije aktiviran (profile=etl ne pokrenut bez --profile etl); produkcija samo serve
# - Coolify proxy network (`coolify`) priključen na servis koji se public exposa (samo mcp)

services:
  postgres:
    # Bez izmjena — PG ostaje internal-only.
    # NB: u Fazi 1 cloud-a PG je u biti prazan (MCP ne čita PG za search_podcasts).
    # Tek kad dođe `list_channels`/`list_speakers` tool, treba sync iz lokala.
    restart: unless-stopped

  clickhouse:
    # Bez izmjena — CH ostaje internal-only, primarni store.
    # Backup/restore se radi preko `BACKUP TABLE ... TO Disk('r2_backup')` —
    # vidi docs/cloud_deployment_plan.md §3-5.
    restart: unless-stopped

  embedder:
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL:-BAAI/bge-m3}
      # Cloud VPS nema MPS/CUDA — fallback na CPU. bge-m3 na CPU radi ~1-3s/query,
      # tolerable jer query embed je jedan vector, ne batch ingest.
      EMBEDDER_DEVICE: cpu
      EMBEDDER_BATCH_SIZE: "32"
      EMBEDDER_MAX_TEXT_LEN: "32768"
    # Iznad base-a override: NE attachaj na 'web' u prod-u; embedder zovne samo MCP iz internal-a.
    networks: [internal]

  mcp:
    environment:
      MCP_TRANSPORT: http
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      EMBEDDER_URL: http://embedder:8000
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-api_key}
      MCP_API_KEY: ${MCP_API_KEY}
    # Override base-a: nikakvi published ports. Traefik forwardira interno port 3000.
    ports: []
    networks: [internal, coolify]
    labels:
      # Traefik discovery
      - "traefik.enable=true"
      # Coolify konvencija: prefix imena routera/servisa s Coolify app-om, ali za clean rule
      # ovdje koristimo `mcp-rag`. Ako bude konflikt s drugim Coolify app-om, rename.
      - "traefik.http.routers.mcp-rag.rule=Host(`mcp.domovina.ai`)"
      # CF Tunnel -> Traefik je HTTP (TLS terminacija na Cloudflare edge), pa entrypoint=http.
      # Bez TLS resolver-a; nema Let's Encrypt jer CF radi cert.
      - "traefik.http.routers.mcp-rag.entrypoints=http"
      - "traefik.http.services.mcp-rag.loadbalancer.server.port=3000"
      # Coolify auto-manage hint (radi i bez ovoga, ali eksplicitno)
      - "coolify.managed=true"

networks:
  coolify:
    # Coolify v4 default proxy network. Provjeri ime na VPS-u s `docker network ls | grep coolify`
    # i prilagodi ako se zove drugačije (npr. `coolify-proxy`).
    external: true
    name: coolify
