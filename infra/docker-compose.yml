# Stack za domovina-rag.
# Plan: ../../fetch.domovina.tv/docs/rag_clickhouse_postgres_plan.md §9

services:
  postgres:
    # pgvector image dodaje `vector` extension (potrebno za infra/postgres/init.sql).
    # Vanilla postgres:16-alpine nema pgvector pa init script fail-a.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedder:
    build: ../services/embedder
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL}
      EMBEDDER_DEVICE: ${EMBEDDER_DEVICE}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks: [internal]
    restart: unless-stopped
    # `full` profile zato što je build velik (~3GB s torch+bge-m3 weights);
    # za minimal dev (samo DB-ovi) `docker compose up postgres clickhouse` ne dira ovo.
    profiles: ["full"]

  etl:
    build: ../services/etl
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      embedder: { condition: service_healthy }
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      EMBEDDER_URL: http://embedder:8000
    volumes:
      # Read-only mount producer output direktorija. Override DATA_SOURCE_DIR u .env-u
      # da uperi na lokalni path (npr. `../fetch.domovina.tv/storage/output`).
      - ${DATA_SOURCE_DIR}:/data:ro
    networks: [internal]
    # One-shot job — pokreće se preko `docker compose run --rm etl ingest --input /data`.
    profiles: ["etl"]

  mcp:
    build: ../services/mcp
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      embedder: { condition: service_healthy }
    environment:
      MCP_TRANSPORT: http
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      EMBEDDER_URL: http://embedder:8000
      MCP_AUTH_MODE: ${MCP_AUTH_MODE}
      MCP_API_KEY: ${MCP_API_KEY}
    ports:
      - "${MCP_PORT}:3000"
    networks: [internal, web]
    restart: unless-stopped
    profiles: ["full"]

volumes:
  pg_data:
  ch_data:
  hf_cache:

networks:
  internal:
    internal: true
  web:
    driver: bridge
