# Bootstrap docker-compose skelet — servisi su 🚧 stub
# Implementacija: vidi sibling repo plan §9
# https://github.com/domovinatv/fetch.domovina.tv/blob/main/docs/rag_clickhouse_postgres_plan.md#9-coolify-deployment-plan

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.10
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedder:
    build: ../services/embedder
    environment:
      EMBEDDER_MODEL: ${EMBEDDER_MODEL}
      EMBEDDER_DEVICE: ${EMBEDDER_DEVICE}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks: [internal]
    restart: unless-stopped
    # Faza 1: gradi se kasnije, ovaj service za sad ne postoji
    profiles: ["full"]

  mcp:
    build: ../services/mcp
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    environment:
      POSTGRES_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CLICKHOUSE_URL: http://${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}@clickhouse:8123/${CLICKHOUSE_DB}
      EMBEDDER_URL: http://embedder:${EMBEDDER_PORT}
      MCP_AUTH_MODE: ${MCP_AUTH_MODE}
      MCP_API_KEY: ${MCP_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      VERTEX_PROJECT: ${VERTEX_PROJECT}
    ports:
      - "${MCP_PORT}:3000"
    networks: [internal, web]
    restart: unless-stopped
    profiles: ["full"]

volumes:
  pg_data:
  ch_data:
  hf_cache:

networks:
  internal:
    internal: true
  web:
    driver: bridge
